name: SQLite本文引用源码验收

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sqlite-local-references.yml', 'scripts/sqlite-workspace-ci.mjs', 'src/shared/localReference*.ts', 'src/shared/sqliteCompletion*.ts', 'src/shared/sqliteLocalReferences.ts', 'src/renderer/completion.worker.ts', 'src/renderer/localReferencesWorkerClient.ts', 'src/renderer/sqlReferencesProvider.ts', 'src/renderer/sqlReferenceCompletionGuard.ts', 'src/renderer/sqliteLocalReferences*', 'src/renderer/sqliteCompletion*', 'src/renderer/components/SqlEditor.tsx', 'tests/unit/sqlite-local-references*', 'tests/unit/sqlite-offline-ci.test.ts', 'tests/unit/sqlite-definition*', 'tests/e2e/sqlite-completion-native.spec.ts', 'patches/monaco-editor@0.55.1.patch', 'package.json', 'pnpm-lock.yaml']
  pull_request:
    paths: ['.github/workflows/sqlite-local-references.yml', 'scripts/sqlite-workspace-ci.mjs', 'src/shared/localReference*.ts', 'src/shared/sqliteCompletion*.ts', 'src/shared/sqliteLocalReferences.ts', 'src/renderer/completion.worker.ts', 'src/renderer/localReferencesWorkerClient.ts', 'src/renderer/sqlReferencesProvider.ts', 'src/renderer/sqlReferenceCompletionGuard.ts', 'src/renderer/sqliteLocalReferences*', 'src/renderer/sqliteCompletion*', 'src/renderer/components/SqlEditor.tsx', 'tests/unit/sqlite-local-references*', 'tests/unit/sqlite-offline-ci.test.ts', 'tests/unit/sqlite-definition*', 'tests/e2e/sqlite-completion-native.spec.ts', 'patches/monaco-editor@0.55.1.patch', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:

permissions:
  contents: read

# 原窗口及失败上传保留，每个run独立，不因新提交取消旧轮。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  references:
    name: SQLite本文引用 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装锁定依赖和Electron
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: 单次运行SQLite与MySQL引用、原声明和取消回归
        run: pnpm exec vitest run tests/unit/sqlite-local-references.test.ts tests/unit/sqlite-local-references-worker.test.ts tests/unit/sqlite-local-references-runtime.test.ts tests/unit/sqlite-offline-ci.test.ts tests/unit/sql-reference-completion-guard.test.ts tests/unit/local-references.test.ts tests/unit/local-references-worker.test.ts tests/unit/completion-worker-client.test.ts tests/unit/completion-window-worker.test.ts tests/unit/local-references-lifecycle.test.ts tests/unit/local-references-ci.test.ts tests/unit/completion-definition.test.ts tests/unit/mysql-definition-analysis.test.ts tests/unit/sqlite-definition.test.ts tests/unit/sqlite-definition-provider.test.ts tests/unit/sqlite-completion-analysis.test.ts tests/unit/sqlite-completion-worker-client.test.ts tests/unit/monaco-word-highlighter-guard.test.ts tests/unit/monaco-word-highlighter-canceled.test.ts tests/unit/monaco-tree-canceled.test.ts --maxWorkers=1
      - name: 严格类型检查和构建
        run: pnpm build
      - name: 单次原完整SQLite工作区加四次真实引用跳转
        run: node scripts/sqlite-workspace-ci.mjs references
      - name: 记录准确源码和平台
        if: always()
        run: |
          node -e "const fs=require('node:fs');fs.mkdirSync('test-results/sqlite-local-references',{recursive:true});fs.writeFileSync('test-results/sqlite-local-references/platform.json',JSON.stringify({platform:process.platform,arch:process.arch,node:process.version}))"
          git rev-parse HEAD > test-results/sqlite-local-references/head.txt
      - name: 保存原报告、截图及退出清理原件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-local-references-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/sqlite-local-references/
          if-no-files-found: warn
