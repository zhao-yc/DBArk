name: 0.28 Windows源码与真实安装验收
on:
  push:
    branches:
      - codex/v028-windows-acceptance-20261019
permissions:
  contents: read
concurrency:
  group: v028-windows-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: 编译固定Windows文件helper（不执行协议）
        run: node scripts/check-backup-windows-helper.mjs
      - name: 固定离线端口单次预检
        run: node scripts/check-offline-query-port.mjs
      - name: 同次源码构建批准及缩进分栏
        id: native-source
        run: node scripts/native-editor-ci.mjs source
      - name: 同一源码批准的首次文件模型四例
        run: node scripts/native-file-first-model-ci.mjs source
        env:
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL: ${{ steps.native-source.outputs.source_approval }}
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL_SHA256: ${{ steps.native-source.outputs.source_approval_sha256 }}
      - name: 原源码离线回归
        run: pnpm exec playwright test --output=test-results/legacy-source
        env:
          DBARK_INTEGRATION_ENABLED: '0'
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
          DBARK_EDITOR_FONT_NATIVE_TEST: '1'
          DBARK_QUERY_DUPLICATE_NATIVE_TEST: '1'
          DBARK_QUERY_CLOSE_OTHERS_NATIVE_TEST: '1'
          DBARK_SNIPPETS_NATIVE_DIAGNOSTICS: '1'
      - name: 构建同次未签名NSIS产物
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 原真实安装流程与安装原生回归
        run: pnpm test:packaged
        env:
          DBARK_NATIVE_EDITOR_CI: '1'
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL: ${{ steps.native-source.outputs.source_approval }}
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL_SHA256: ${{ steps.native-source.outputs.source_approval_sha256 }}
          DBARK_NATIVE_EDITOR_REFERENCE_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/DBArk.exe
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
          DBARK_EDITOR_FONT_NATIVE_TEST: '1'
          DBARK_QUERY_DUPLICATE_NATIVE_TEST: '1'
          DBARK_QUERY_CLOSE_OTHERS_NATIVE_TEST: '1'
      - name: 仅成功后保留未发布安装候选
        uses: actions/upload-artifact@v4
        with:
          name: v028-Windows-x64-${{ github.run_id }}-${{ github.run_attempt }}-unsigned
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
      - name: 保留原测试证据（失败不补清理）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v028-Windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
