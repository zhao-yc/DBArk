name: SQL本文引用源码验收

on:
  push:
    branches: [main]
    paths: ['.github/workflows/local-references.yml', 'scripts/local-references-ci.*', 'scripts/monaco-word-highlighter-guard.ts', 'patches/monaco-editor@0.55.1.patch', 'src/shared/localReferences*', 'src/shared/completion*.ts', 'src/renderer/localReferences*', 'src/renderer/sqlReferencesProvider.ts', 'src/renderer/components/SqlEditor.tsx', 'src/renderer/completionContext.ts', 'tests/unit/local-references*', 'tests/unit/monaco-*-canceled.test.ts', 'tests/unit/monaco-word-highlighter-guard.test.ts', 'tests/fixtures/monaco-word-highlighter.ts', 'tests/e2e/local-references-native.spec.ts', 'package.json', 'pnpm-lock.yaml']
  pull_request:
    paths: ['.github/workflows/local-references.yml', 'scripts/local-references-ci.*', 'scripts/monaco-word-highlighter-guard.ts', 'patches/monaco-editor@0.55.1.patch', 'src/shared/localReferences*', 'src/shared/completion*.ts', 'src/renderer/localReferences*', 'src/renderer/sqlReferencesProvider.ts', 'src/renderer/components/SqlEditor.tsx', 'src/renderer/completionContext.ts', 'tests/unit/local-references*', 'tests/unit/monaco-*-canceled.test.ts', 'tests/unit/monaco-word-highlighter-guard.test.ts', 'tests/fixtures/monaco-word-highlighter.ts', 'tests/e2e/local-references-native.spec.ts', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:

permissions:
  contents: read

# 保留每轮原任务及失败原件；新提交不取消正在退出或上传的窗口。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  references:
    name: 本文引用 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装锁定依赖和Electron
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec install-electron
      - name: 单次执行引用和原声明回归
        run: pnpm exec vitest run tests/unit/local-references.test.ts tests/unit/local-references-worker.test.ts tests/unit/local-references-lifecycle.test.ts tests/unit/local-references-ci.test.ts tests/unit/completion-definition.test.ts tests/unit/mysql-definition-analysis.test.ts tests/unit/sqlite-definition.test.ts tests/unit/sqlite-definition-provider.test.ts tests/unit/monaco-word-highlighter-guard.test.ts tests/unit/monaco-word-highlighter-canceled.test.ts tests/unit/monaco-tree-canceled.test.ts --maxWorkers=1
      - name: 严格类型检查及构建
        run: pnpm build
      - name: 单次执行真实Shift加F12与引用跳转
        run: node scripts/local-references-ci.mjs
      - name: 记录准确源码与平台
        if: always()
        run: |
          node -e "const fs=require('node:fs');fs.mkdirSync('test-results/local-references',{recursive:true});fs.writeFileSync('test-results/local-references/platform.json',JSON.stringify({platform:process.platform,arch:process.arch,node:process.version}))"
          git rev-parse HEAD > test-results/local-references/head.txt
      - name: 保存原报告、截图及退出回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-references-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/local-references/
          if-no-files-found: warn
