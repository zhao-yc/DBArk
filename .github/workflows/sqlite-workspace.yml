name: SQLite原工作区源码验收

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sqlite-workspace.yml'
      - 'src/**'
      - 'tests/e2e/**'
      - 'tests/helpers/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'
      - '*.config.*'
  pull_request:
    paths:
      - '.github/workflows/sqlite-workspace.yml'
      - 'src/**'
      - 'tests/e2e/**'
      - 'tests/helpers/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig*.json'
      - '*.config.*'
  workflow_dispatch:

permissions:
  contents: read

# 每轮独立保留真实终态；后来push或手动运行不取消旧轮现场。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  sqlite-workspace:
    name: SQLite原工作区 · ${{ matrix.label }} · ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
        suite: [workspace, management]
        include:
          - os: windows-latest
            label: Windows x64
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: macOS-x64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 启用项目声明的pnpm版本
        run: corepack enable
      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装Electron运行时
        run: pnpm exec install-electron
      - name: 构建当前源码
        run: pnpm build
      - name: 单次运行SQLite原工作区真实专项
        # 120秒由spec自身保持；单worker、零重试且不采集trace。
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs workspace
        env:
          DBARK_INTEGRATION_ENABLED: '0'
          DBARK_SQLITE_WORKSPACE_NATIVE_TEST: '1'
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/sqlite-workspace/report.json
      - name: 单次运行SQLite只读表分页筛选排序专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs table
      - name: 单次运行SQLite完整流式导出专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs export
      - name: 单次运行SQLite表格增删改事务专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs edit
      - name: 单次运行SQLite结构SQL导出专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs schema-export
      - name: 单次运行SQLite当前语句原生专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs current
      - name: 单次运行SQLite执行计划原生专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs explain
      - name: 单次运行SQLite类型参数脚本原生专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs parameters
      - name: 单次运行SQLite新建数据库文件原生专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs create
      - name: 单次运行SQLite可视化新建表原生专项
        if: matrix.suite == 'workspace'
        run: node scripts/sqlite-workspace-ci.mjs table-create
      - name: 单次运行SQLite现有表CSV与JSON导入原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs table-import
      - name: 单次运行SQLite文件导入为新表原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs import-new-table
      - name: 单次运行SQLite已有表索引管理原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs indexes
      - name: 单次运行SQLite已有表字段管理原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs columns
      - name: 单次运行SQLite已有表重命名原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs table-rename
      - name: 单次运行SQLite已有表清空删除原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs table-maintenance
      - name: 单次运行SQLite视图触发器管理原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs objects
      - name: 单次运行SQLite字段类型默认值重建原生专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs table-rebuild
      - name: 单次运行SQLite复制与粘贴新增草稿专项
        if: matrix.suite == 'management'
        run: node scripts/sqlite-workspace-ci.mjs clipboard
      - name: 始终保留本轮SQLite专项原始记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SQLite原工作区-${{ matrix.artifact }}-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/sqlite-workspace/
            test-results/sqlite-table-browse/
            test-results/sqlite-table-export/
            test-results/sqlite-table-edit/
            test-results/sqlite-schema-export/
            test-results/sqlite-current-statement/
            test-results/sqlite-explain/
            test-results/sqlite-parameters/
            test-results/sqlite-create/
            test-results/sqlite-table-create/
            test-results/sqlite-table-import/
            test-results/sqlite-import-new-table/
            test-results/sqlite-indexes/
            test-results/sqlite-columns/
            test-results/sqlite-table-rename/
            test-results/sqlite-table-maintenance/
            test-results/sqlite-objects/
            test-results/sqlite-table-rebuild/
            test-results/sqlite-table-clipboard/
          if-no-files-found: warn
