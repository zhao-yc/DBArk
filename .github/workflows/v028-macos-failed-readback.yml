name: 0.28 Mac已归档安装失败只读回读
on:
  push:
    branches:
      - codex/v028-serial-closeout-20261019
    paths:
      - .github/workflows/v028-macos-failed-readback.yml
      - scripts/read-v028-macos-installed-failure.py
      - scripts/read-v028-macos-installed-failure.mjs
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 固定原失败归档的字节摘要与CRC
        run: python3 scripts/read-v028-macos-installed-failure.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 原安装六项与原租约失败分别核对
        run: node scripts/read-v028-macos-installed-failure.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v028-Mac-installed-failure-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/macos-installed-failure-readback-39253421880/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
