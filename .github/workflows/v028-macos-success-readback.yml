name: 0.28 Mac成功安装原归档只读回读
on:
  push:
    branches:
      - codex/v028-serial-closeout-20261019
    paths:
      - .github/workflows/v028-macos-success-readback.yml
      - scripts/read-v028-macos-installed-success.py
      - scripts/read-v028-macos-installed-success.mjs
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 原ZIP字节摘要、全部CRC与应用ZIP内部CRC
        run: python3 scripts/read-v028-macos-installed-success.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 原安装批准、原六项报告及正常恢复
        run: node scripts/read-v028-macos-installed-success.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v028-Mac-installed-success-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/macos-installed-success-readback-39256090941/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
