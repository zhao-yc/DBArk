name: 0.28 已归档原生报告只读回读
on:
  push:
    branches:
      - codex/v028-serial-closeout-20261019
    paths:
      - .github/workflows/v028-artifact-readback.yml
      - scripts/read-v028-macos-artifact.mjs
      - scripts/read-v028-windows-artifact.mjs
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 仅下载固定旧run的已上传产物；不访问失败VM或执行归档中的程序。
      - uses: actions/download-artifact@v4
        with:
          name: v028-Windows-evidence-39242374243-1
          github-token: ${{ github.token }}
          run-id: 39242374243
          path: .cache/windows-artifact-readback-39242374243
      - name: 原来源、报告摘要与实际窗口坐标
        run: node scripts/read-v028-windows-artifact.mjs
