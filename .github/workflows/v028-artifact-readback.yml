name: 0.28 已归档原生报告只读回读
on:
  push:
    branches:
      - codex/v028-serial-closeout-20261019
    paths:
      - .github/workflows/v028-artifact-readback.yml
      - scripts/read-v028-macos-artifact.mjs
      - scripts/read-v028-windows-artifact.mjs
      - scripts/read-v028-windows-success-archive.py
      - scripts/read-v028-windows-success-reports.mjs
permissions:
  contents: read
  actions: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 仅消费已结束的固定成功运行；旧失败归档和旧 VM 不动。
      - name: 固定成功归档的独立字节摘要和CRC
        run: python3 scripts/read-v028-windows-success-archive.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: 原批准与源码安装专项原终态
        run: node scripts/read-v028-windows-success-reports.mjs
      - name: 留存本次接收的原ZIP与资产摘要
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v028-Windows-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/windows-success-readback-39244695054/
          if-no-files-found: warn
          retention-days: 14
