name: 客户端检查与构建
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: 类型与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: pnpm dist:win
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            command: pnpm build && pnpm exec electron-builder --mac --arm64 --publish never
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            command: pnpm build && pnpm exec electron-builder --mac --x64 --publish never
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test:e2e
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: DBArk-${{ matrix.artifact }}-未发行签名
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 测试记录-${{ matrix.artifact }}
          path: test-results/
  release:
    name: 发布开发预览
    needs: [checks, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DBArk-*
          path: release-assets
          merge-multiple: true
      - name: 校验版本、归档源码并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
          git archive --format=zip --prefix="DBArk-$version/" --output="release-assets/DBArk-$version-source.zip" HEAD
          cd release-assets
          shopt -s nullglob
          assets=(*.exe *.dmg *.zip *.blockmap)
          test "${#assets[@]}" -ge 6
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --verify-tag --prerelease --title "DBArk $version 开发预览" --notes-file "../docs/releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
