name: 客户端检查与构建
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      native_clipboard_components:
        description: '在三个临时原生runner补验13项离线开发组件剪贴板用例'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# 同一ref只保留最新非标签检查；标签按运行及重跑代次隔离，避免发行运行被替换或取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.run_id, github.run_attempt) || 'latest' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    name: 类型与单元测试
    if: github.event_name != 'workflow_dispatch' || inputs.native_clipboard_components != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  desktop:
    name: ${{ matrix.label }}
    # 员工任务分支保留Linux完整检查；集成、PR、主分支、发行标签和明确手动运行仍走全部原生门。
    if: >-
      (github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/task/parallel-integration-') ||
      startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || inputs.native_clipboard_components != true)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: pnpm dist:win
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            command: pnpm build && pnpm exec electron-builder --mac --arm64 --publish never
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            command: pnpm build && pnpm exec electron-builder --mac --x64 --publish never
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test:e2e
        env:
          # 已验的本地查询导航在三个原生平台执行；私网用例继续关闭。
          DBARK_INTEGRATION_ENABLED: '0'
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
          # 仅源码 E2E 的固定离线片段用例采集；安装验收与实库用例不继承此门。
          DBARK_SNIPPETS_NATIVE_DIAGNOSTICS: '1'
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:packaged
        env:
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: DBArk-${{ matrix.artifact }}-未发行签名
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 测试记录-${{ matrix.artifact }}
          path: test-results/
  # 只在明确手动勾选时运行；三个夹具启动独立开发Electron，不计安装产品验收。
  # 合成数据仅写临时原生runner剪贴板；空剪贴板恢复结果不能外推本机富格式恢复。
  native-clipboard-components:
    name: 离线开发组件原生剪贴板 · ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.native_clipboard_components == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DBARK_INTEGRATION_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      # 锚定既定13项标题，避免二进制文件内其他用例混入；单worker、单次、0retry。
      - name: 仅验13项离线开发组件（不计安装产品）
        run: >-
          pnpm exec playwright test
          tests/e2e/query-binary-types-offline.spec.ts
          tests/e2e/record-input-guards-offline.spec.ts
          tests/e2e/binary-cell-offline.spec.ts
          --grep='(?:^|\s)(?:wire BLOB中的TEXT LONGTEXT及NULL双击和Enter均不打开字节查看器|真实字节及空字节保留双击Enter与只读守卫，重复别名标题按name值按key|document全量超限原生粘贴整次拒绝，不能暂存合法前缀|document满预算合法dirty输入的选区替换拒绝后，仅暂存旧完整值|document非法旧缓冲遇到超限粘贴仍不可暂存，修正后完整恢复|documentCRLF沿用原生选区语义，Unicode完整替换且UTF8超限不接收前缀|document可信普通输入与组合提交的完整值也经预算兜底，旧缓冲不变|node全量超限原生粘贴整次拒绝，不能暂存合法前缀|node满预算合法dirty输入的选区替换拒绝后，仅暂存旧完整值|node非法旧缓冲遇到超限粘贴仍不可暂存，修正后完整恢复|nodeCRLF沿用原生选区语义，Unicode完整替换且UTF8超限不接收前缀|node可信普通输入与组合提交的完整值也经预算兜底，旧缓冲不变|单元格及记录表单真实剪贴板超限不截断，选区替换整次拒绝，合法边界可暂存)$'
          --workers=1 --retries=0 --reporter="list,json"
        env:
          DBARK_QUERY_BINARY_NATIVE_ENABLED: '1'
          DBARK_RECORD_INPUT_NATIVE_ENABLED: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/native-clipboard-components/report.json
      - name: 保存开发组件验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 开发组件原生剪贴板-${{ matrix.artifact }}
          path: test-results/
          if-no-files-found: warn
  release:
    name: 发布开发预览
    needs: [checks, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DBArk-*
          path: release-assets
          merge-multiple: true
      - name: 校验版本、归档源码并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
          git archive --format=zip --prefix="DBArk-$version/" --output="release-assets/DBArk-$version-source.zip" HEAD
          cd release-assets
          shopt -s nullglob
          assets=(*.exe *.dmg *.zip *.blockmap)
          test "${#assets[@]}" -ge 6
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --verify-tag --prerelease --title "DBArk $version 开发预览" --notes-file "../docs/releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
