name: 客户端检查与构建
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    name: 类型与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  desktop:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: pnpm dist:win
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            command: pnpm build && pnpm exec electron-builder --mac --arm64 --publish never
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            command: pnpm build && pnpm exec electron-builder --mac --x64 --publish never
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm test:e2e
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: DBArk-${{ matrix.artifact }}-未发行签名
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: 测试记录-${{ matrix.artifact }}
          path: test-results/
