name: 客户端检查与构建
# 固定0.28旧文件合同与分栏窗口就绪的R9源码及真实安装验收检查点。
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      native_clipboard_components:
        description: '在三个临时原生runner补验12项离线开发组件剪贴板用例'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
# 原生专项按运行及代次隔离；新push不得取消正在采集的原失败现场。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  checks:
    name: 类型与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  desktop:
    name: ${{ matrix.label }}
    # 员工任务分支保留Linux完整检查；集成、PR、主分支、发行标签和明确手动运行仍走全部原生门。
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/codex/native-checkpoint-') ||
      startsWith(github.ref, 'refs/heads/task/parallel-integration-') ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: pnpm exec electron-builder --win --x64 --publish never
            reference: release/win-unpacked/DBArk.exe
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            command: pnpm exec electron-builder --mac --arm64 --publish never
            reference: release/mac-arm64/DBArk.app/Contents/MacOS/DBArk
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            command: pnpm exec electron-builder --mac --x64 --publish never
            reference: release/mac/DBArk.app/Contents/MacOS/DBArk
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: 编译固定Windows敏感文件helper（不执行协议）
        if: runner.os == 'Windows'
        run: node scripts/check-backup-windows-helper.mjs
      - name: 预检固定离线查询端口（仅127.0.0.1:1）
        run: node scripts/check-offline-query-port.mjs
      - name: 同次构建封存并单次验证源码缩进与分栏专项
        id: native-source
        run: node scripts/native-editor-ci.mjs source
      - run: pnpm exec playwright test --output=test-results/legacy-source
        env:
          # 已验的本地查询导航在三个原生平台执行；私网用例继续关闭。
          DBARK_INTEGRATION_ENABLED: '0'
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
          # 真实Monaco热更新、SQLite落盘及独立重启；不使用系统剪贴板或私网数据库。
          DBARK_EDITOR_FONT_NATIVE_TEST: '1'
          # 真实查询复制、保存来源与Undo基线；仅固定离线连接，不接私网或系统剪贴板。
          DBARK_QUERY_DUPLICATE_NATIVE_TEST: '1'
          # 串行关闭其他查询的两项正式离线用例；预检拒连并等原socket关闭后才启动。
          DBARK_QUERY_CLOSE_OTHERS_NATIVE_TEST: '1'
          # 仅源码 E2E 的固定离线片段用例采集；安装验收与实库用例不继承此门。
          DBARK_SNIPPETS_NATIVE_DIAGNOSTICS: '1'
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm test:packaged
        env:
          DBARK_NATIVE_EDITOR_CI: '1'
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL: ${{ steps.native-source.outputs.source_approval }}
          DBARK_NATIVE_EDITOR_SOURCE_APPROVAL_SHA256: ${{ steps.native-source.outputs.source_approval_sha256 }}
          DBARK_NATIVE_EDITOR_REFERENCE_EXECUTABLE: ${{ github.workspace }}/${{ matrix.reference }}
          DBARK_W03_SAVED_QUERY_NAVIGATION_TEST: '1'
          DBARK_EDITOR_FONT_NATIVE_TEST: '1'
          DBARK_QUERY_DUPLICATE_NATIVE_TEST: '1'
          DBARK_QUERY_CLOSE_OTHERS_NATIVE_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: DBArk-${{ matrix.artifact }}-未发行签名
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 测试记录-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
  # 只在明确手动勾选时运行；两个夹具启动独立开发Electron，不计安装产品验收。
  native-clipboard-components:
    name: 离线开发组件原生剪贴板 · ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.native_clipboard_components == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: Windows-x64
          - os: macos-latest
            label: macOS arm64
            artifact: macOS-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DBARK_INTEGRATION_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: 仅验两个离线开发组件（12项，不计安装产品）
        run: >-
          pnpm exec playwright test
          tests/e2e/query-binary-types-offline.spec.ts
          tests/e2e/record-input-guards-offline.spec.ts
          --workers=1 --retries=0 --reporter="list,json"
        env:
          DBARK_QUERY_BINARY_NATIVE_ENABLED: '1'
          DBARK_RECORD_INPUT_NATIVE_ENABLED: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/native-clipboard-components/report.json
      - name: 保存开发组件验收记录
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 开发组件原生剪贴板-${{ matrix.artifact }}
          path: test-results/
          if-no-files-found: warn
  release:
    name: 发布开发预览
    needs: [checks, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DBArk-*
          path: release-assets
          merge-multiple: true
      - name: 校验版本、归档源码并发布
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          test -f "docs/releases/$RELEASE_TAG.md"
          git archive --format=zip --prefix="DBArk-$version/" --output="release-assets/DBArk-$version-source.zip" HEAD
          cd release-assets
          shopt -s nullglob
          assets=(*.exe *.dmg *.zip *.blockmap)
          test "${#assets[@]}" -ge 6
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS.txt --verify-tag --prerelease --title "DBArk $version 开发预览" --notes-file "../docs/releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY"
